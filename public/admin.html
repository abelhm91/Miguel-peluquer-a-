<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda · Miguel de la Cruz</title>
  <link rel="icon" href="/assets/logo-sello.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.5 4-2 1.3a11 11 0 0 0 6.5 6.5l1.3-2 4 1.5v2.6a2 2 0 0 1-2.1 2A16.5 16.5 0 0 1 4.6 5.6a2 2 0 0 1 2-2.1Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 19.5 5.3 16A8 8 0 1 1 8 18.7Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4.5h14v15H5zM8.5 9h7M8.5 12.5h7M8.5 16h4"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4.5h4.5v15H14M10 8l-4 4 4 4M6 12h9"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </svg>

  <!-- acceso -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="login-form">
      <img src="/assets/logo-sello.png" alt="" width="88" height="88">
      <h1>Agenda de Miguel</h1>
      <div class="alert" id="login-error" role="alert" hidden></div>
      <div class="field">
        <label for="pw">Contraseña</label>
        <input class="input" id="pw" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--block" type="submit">Entrar</button>
      <a class="muted small" href="/">Volver a la web</a>
    </form>
  </main>

  <!-- panel -->
  <div class="app" id="app" hidden>
    <header class="appbar">
      <div class="appbar__inner">
        <a class="brand" href="/" title="Ver la web pública">
          <img src="/assets/logo-sello.png" alt="" width="32" height="32"><span class="brand__word">Pentinats</span>
        </a>
        <nav class="tabs" aria-label="Secciones">
          <a href="#agenda" data-tab="agenda">Agenda</a>
          <a href="#proximas" data-tab="proximas">Próximas</a>
          <a href="#horario" data-tab="horario">Horario</a>
          <a href="#servicios" data-tab="servicios">Servicios</a>
          <a href="#ajustes" data-tab="ajustes">Ajustes</a>
        </nav>
        <a class="appbar__web" href="/" target="_blank" rel="noopener"><svg class="icon"><use href="#i-web"/></svg><span>Ver mi web</span></a>
        <button class="icon-btn" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="icon"><use href="#i-out"/></svg></button>
      </div>
    </header>
    <div class="banner" id="setup-banner" hidden>
      <svg class="icon"><use href="#i-info"/></svg>
      <span>La reserva online está <strong>cerrada</strong> porque aún no has puesto tu horario.</span>
      <a class="btn btn--small" href="#horario">Poner horario</a>
    </div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin.js" type="module"></script>
</body>
</html>
